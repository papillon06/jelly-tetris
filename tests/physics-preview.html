<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>软体物理检验</title><style>body{font:14px system-ui;background:#c7eaf5;color:#234;margin:20px}button{padding:10px;margin:8px 5px;cursor:pointer}.scenes{display:flex;gap:20px;flex-wrap:wrap}canvas{background:#edfaff;border:3px solid #354354;width:240px;height:480px}pre{font-size:11px;white-space:pre-wrap;width:240px}h2{font-size:14px}</style><h1>软体碰撞检验</h1><button id="run">运行 5 秒</button><button id="reset">重置</button><button id="live">实时播放</button><span id="status">待运行</span><div class="scenes" id="scenes"></div><script type="module">
import {SoftWorld,sampleBody,getBodyBounds,getBodyCentroid,getBodyAngle} from '../dist/soft-physics.js';
import {renderGel} from '../dist/gel-renderer.js';
let scenes=[],running=false,last=0;
const I=[{x:0,y:0},{x:0,y:1},{x:0,y:2},{x:0,y:3}],O=[{x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1}],T=[{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],L=[{x:0,y:0},{x:0,y:1},{x:0,y:2},{x:1,y:2}];
function reset(){scenes=[];document.querySelector('#scenes').innerHTML='';let defs=[['重心偏移后歪倒',w=>{w.addBody('O',[{x:0,y:0}],{x:1.1,y:7});return w.addBody('I',I,{x:1.6,y:3,angle:.08});}],['侧碰挤到相邻位置',w=>{w.addBody('O',O,{x:.1,y:6});return w.addBody('T',T,{x:.8,y:1,angle:.35,vx:1.2});}],['冲击、压缩、回弹',w=>w.addBody('L',L,{x:.8,y:0,angle:.18,vy:5})],['多块连续堆叠',w=>{w.addBody('T',T,{x:.1,y:6});w.addBody('O',O,{x:1.8,y:3,angle:-.15});return w.addBody('L',L,{x:.4,y:-.5,angle:.25});}]];for(const[title,create]of defs){const world=new SoftWorld({width:4,height:8});const tracked=create(world);const el=document.createElement('div');el.innerHTML='<h2>'+title+'</h2><canvas width="480" height="960"></canvas><pre></pre>';document.querySelector('#scenes').append(el);const canvas=el.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.scale(2,2);scenes.push({world,tracked,ctx,el,initial:getBodyCentroid(tracked),angle:getBodyAngle(tracked)});}draw();document.querySelector('#status').textContent='已重置';}
function draw(){for(const s of scenes){s.ctx.clearRect(0,0,240,480);for(const b of s.world.bodies)renderGel(s.ctx,b.cells,{cellSize:60,type:b.type,deform:(x,y)=>sampleBody(b,x,y)});const c=getBodyCentroid(s.tracked),b=getBodyBounds(s.tracked);s.el.querySelector('pre').textContent=JSON.stringify({angleDegrees:(getBodyAngle(s.tracked)*180/Math.PI).toFixed(1),deltaX:(c.x-s.initial.x).toFixed(3),bounds:b,nodes:s.tracked.nodes.length},null,2);}}
document.querySelector('#run').onclick=()=>{running=false;for(let i=0;i<300;i++)for(const s of scenes)s.world.step(1/60);draw();document.querySelector('#status').textContent='已模拟 5 秒';};document.querySelector('#reset').onclick=reset;document.querySelector('#live').onclick=()=>running=!running;
function frame(t){if(running){for(const s of scenes)s.world.step(Math.min(.033,(t-last)/1000||.016));draw();}last=t;requestAnimationFrame(frame);}reset();requestAnimationFrame(frame);
</script></html>
